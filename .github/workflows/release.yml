name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # The manifest holds the next version to publish (1.0.0 for the first release).
      # If that tag already exists, the patch number is incremented.
      - name: Choose version
        id: version
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest_path = Path("custom_components/evakool/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          major, minor, patch = (int(part) for part in manifest["version"].split("."))
          tags = subprocess.run(
              ["git", "tag", "--list"], capture_output=True, text=True, check=True
          ).stdout.split()
          while f"v{major}.{minor}.{patch}" in tags:
              patch += 1
          version = f"{major}.{minor}.{patch}"
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Commit version and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/evakool/manifest.json
          git diff --cached --quiet || git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "EVAKOOL Bluetooth Fridge v${VERSION}"
          git push origin HEAD:main "v${VERSION}"

      - name: Package integration
        run: cd custom_components/evakool && zip -qr ../../evakool.zip . -x '*/__pycache__/*' '*.pyc'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" evakool.zip --title "EVAKOOL Bluetooth Fridge v${VERSION}" --generate-notes
